[package]
name = "covibe-p2p"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Dumb byte-pump sidecar: bridges unix sockets to iroh QUIC streams for covibe"
license = "MIT"
publish = false

[[bin]]
name = "covibe-p2p"
path = "src/main.rs"

[dependencies]
anyhow = "1"
iroh = "1.0.3"
iroh-tickets = "1.0.0"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
