<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Name}} — covibe</title>
<style nonce="{{.Nonce}}">
  :root { color-scheme: dark light; --bg:#0e1116; --card:#171b22; --muted:#8b949e; --fg:#e6edf3; --accent:#4ea1ff; --live:#3fb950; --ended:#8b949e; --start:#d29922; --err:#f85149; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.8rem 1.25rem; border-bottom:1px solid #222; flex:0 0 auto; }
  header .hleft { display:flex; align-items:center; gap:.7rem; min-width:0; }
  header h1 { font-size:1.05rem; margin:0; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conn { display:inline-flex; align-items:center; gap:.4rem; color:var(--muted); font-size:.82rem; white-space:nowrap; }
  .dot { width:.6rem; height:.6rem; border-radius:50%; display:inline-block; background:var(--muted); transition:background .2s; }
  .dot.live{ background:var(--live); } .dot.starting{ background:var(--start); } .dot.ended{ background:var(--ended); } .dot.connecting{ background:var(--start); }
  .badge { font-size:.7rem; padding:.12rem .5rem; border-radius:999px; border:1px solid #333; color:var(--muted); white-space:nowrap; }
  .statusline { color:var(--muted); font-size:.82rem; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:45%; }
  .statusline:empty { display:none; }
  .banner { flex:0 0 auto; padding:.55rem 1.25rem; background:#1d2129; border-bottom:1px solid #30363d; color:var(--ended); font-size:.85rem; }
  .banner[hidden] { display:none; }
  main { flex:1 1 auto; overflow-y:auto; padding:1.25rem; display:flex; flex-direction:column; gap:.85rem; }
  .bubble { border:1px solid #222; border-radius:12px; padding:.7rem .9rem; max-width:min(860px,100%); display:flex; flex-direction:column; gap:.4rem; }
  .bubble.assistant { background:var(--card); align-self:flex-start; }
  .bubble.user { background:#12202e; border-color:#1c3348; align-self:flex-end; }
  .bubble .role { font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .bubble .text { white-space:pre-wrap; word-break:break-word; }
  .bubble .text:empty { display:none; }
  details.think { border:1px solid #2a2f37; border-radius:8px; background:#0b0e13; }
  details.think > summary { cursor:pointer; color:var(--muted); font-size:.75rem; padding:.35rem .55rem; list-style:none; }
  details.think > summary::-webkit-details-marker { display:none; }
  details.think > summary::before { content:'▸ '; }
  details.think[open] > summary::before { content:'▾ '; }
  details.think .think-body { color:var(--muted); font-family:ui-monospace,monospace; font-size:.78rem; white-space:pre-wrap; word-break:break-word; padding:0 .6rem .5rem; }
  .tool { border:1px solid #2a2f37; border-radius:10px; background:var(--card); max-width:min(860px,100%); align-self:flex-start; overflow:hidden; }
  .tool .thead { display:flex; align-items:center; gap:.5rem; padding:.5rem .7rem; border-bottom:1px solid #222; font-family:ui-monospace,monospace; font-size:.82rem; }
  .tool .thead .tname { color:var(--accent); font-weight:600; }
  .tool .thead .tstate { margin-left:auto; font-size:.7rem; color:var(--muted); }
  .tool .tstate.ok { color:var(--live); } .tool .tstate.err { color:var(--err); }
  .tool .tlabel { font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:.45rem .7rem 0; }
  .tool pre { margin:0; padding:.45rem .7rem .6rem; font-family:ui-monospace,monospace; font-size:.76rem; white-space:pre-wrap; word-break:break-word; overflow-x:auto; }
  .tool pre.result.err { color:var(--err); }
  .tool .more { margin:0 .7rem .55rem; background:#21262d; color:var(--fg); border:1px solid #30363d; border-radius:6px; padding:.25rem .55rem; cursor:pointer; font-size:.72rem; }
  .tool .more:hover { border-color:var(--accent); }
  .composer { flex:0 0 auto; border-top:1px solid #222; padding:.75rem 1.25rem; display:flex; gap:.6rem; align-items:flex-end; }
  .composer textarea { flex:1; resize:none; min-height:2.4rem; max-height:9rem; background:#0b0e13; border:1px solid #2a2f37; color:var(--fg); border-radius:8px; padding:.55rem .65rem; font:inherit; font-size:.9rem; }
  .composer textarea:focus { outline:none; border-color:var(--accent); }
  .composer button { background:#21262d; color:var(--fg); border:1px solid #30363d; border-radius:8px; padding:.55rem .9rem; cursor:pointer; font-size:.85rem; }
  .composer button:hover:not(:disabled) { border-color:var(--accent); }
  .composer button:disabled { opacity:.5; cursor:not-allowed; }
  .composer button.send { background:var(--accent); border-color:var(--accent); color:#08121f; font-weight:600; }
  .composer button.interrupt { color:var(--err); }
  .empty { color:var(--muted); text-align:center; padding:3rem 1rem; }
  .empty[hidden] { display:none; }
</style>
</head>
<body>
<header>
  <div class="hleft">
    <h1>{{.Name}}</h1>
    <span class="conn"><span id="dot" class="dot connecting"></span><span id="connlabel">connecting…</span></span>
    <span id="guests" class="badge">— watching</span>
  </div>
  <div id="statusline" class="statusline"></div>
</header>
<div id="banner" class="banner" hidden></div>
<main id="transcript">
  <div id="empty" class="empty">Waiting for session activity…</div>
</main>
{{if .CanWrite}}
<div class="composer">
  <textarea id="input" placeholder="Send a prompt…  (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
  <button id="interrupt" class="interrupt" type="button" title="Interrupt the current turn">Interrupt</button>
  <button id="send" class="send" type="button">Send</button>
</div>
{{end}}
<script nonce="{{.Nonce}}">
"use strict";
const SESSIONID = {{.SessionID}};
const CANWRITE  = {{.CanWrite}};

const transcript = document.getElementById('transcript');
const emptyEl    = document.getElementById('empty');
const dot        = document.getElementById('dot');
const connLabel  = document.getElementById('connlabel');
const guestsEl   = document.getElementById('guests');
const statusEl   = document.getElementById('statusline');
const banner     = document.getElementById('banner');

const RESULT_LIMIT = 1800; // chars before a tool result gets a show-more toggle

// --- correlation state ---------------------------------------------------
const bubbles = new Map(); // id     -> { el, textEl, thinkBody, thinkWrap }
const tools   = new Map(); // callId -> { el }

let ws = null;
let ended = false;
let backoff = 1000;
let reconnectTimer = null;

// --- scroll management ----------------------------------------------------
let stick = true; // auto-scroll only when the user is at (or near) the bottom
transcript.addEventListener('scroll', () => {
  const gap = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight;
  stick = gap < 60;
});
function autoscroll() {
  if (stick) transcript.scrollTop = transcript.scrollHeight;
}
function hideEmpty() { if (emptyEl) emptyEl.hidden = true; }

// --- bubbles --------------------------------------------------------------
function makeBubble(id, role, name) {
  let b = bubbles.get(id);
  if (b) return b;
  const el = document.createElement('div');
  el.className = 'bubble ' + (role === 'user' ? 'user' : 'assistant');

  const roleEl = document.createElement('div');
  roleEl.className = 'role';
  roleEl.textContent = name ? (role || 'assistant') + ' · ' + name : (role || 'assistant');
  el.appendChild(roleEl);

  const textEl = document.createElement('div');
  textEl.className = 'text';
  el.appendChild(textEl);

  b = { el, textEl, thinkBody: null, thinkWrap: null };
  bubbles.set(id, b);
  hideEmpty();
  transcript.appendChild(el);
  autoscroll();
  return b;
}

function appendText(id, delta) {
  const b = makeBubble(id, 'assistant');
  b.textEl.appendChild(document.createTextNode(delta));
  autoscroll();
}

function appendThink(id, delta) {
  const b = makeBubble(id, 'assistant');
  if (!b.thinkWrap) {
    const details = document.createElement('details');
    details.className = 'think';
    const summary = document.createElement('summary');
    summary.textContent = 'thinking';
    details.appendChild(summary);
    const body = document.createElement('div');
    body.className = 'think-body';
    details.appendChild(body);
    // keep thinking above the visible answer text
    b.el.insertBefore(details, b.textEl);
    b.thinkWrap = details;
    b.thinkBody = body;
  }
  b.thinkBody.appendChild(document.createTextNode(delta));
  autoscroll();
}

// --- tool cards -----------------------------------------------------------
function prettyInput(input) {
  if (typeof input === 'string') return input;
  try { return JSON.stringify(input, null, 2); }
  catch (_) { return String(input); }
}

function makeTool(callId, name, input) {
  let t = tools.get(callId);
  if (t) return t;
  const el = document.createElement('div');
  el.className = 'tool';

  const head = document.createElement('div');
  head.className = 'thead';
  const nameEl = document.createElement('span');
  nameEl.className = 'tname';
  nameEl.textContent = name || 'tool';
  head.appendChild(nameEl);
  const state = document.createElement('span');
  state.className = 'tstate';
  state.textContent = 'running…';
  head.appendChild(state);
  el.appendChild(head);

  const inLabel = document.createElement('div');
  inLabel.className = 'tlabel';
  inLabel.textContent = 'input';
  el.appendChild(inLabel);
  const inPre = document.createElement('pre');
  inPre.className = 'input';
  inPre.textContent = prettyInput(input);
  el.appendChild(inPre);

  t = { el, state };
  tools.set(callId, t);
  hideEmpty();
  transcript.appendChild(el);
  autoscroll();
  return t;
}

function endTool(callId, result, ok) {
  const t = tools.get(callId) || makeTool(callId, 'tool', undefined);
  t.state.textContent = ok ? 'done' : 'error';
  t.state.className = 'tstate ' + (ok ? 'ok' : 'err');

  const label = document.createElement('div');
  label.className = 'tlabel';
  label.textContent = ok ? 'result' : 'error';
  t.el.appendChild(label);

  const pre = document.createElement('pre');
  pre.className = 'result' + (ok ? '' : ' err');
  const full = result == null ? '' : String(result);
  if (full.length > RESULT_LIMIT) {
    const head = full.slice(0, RESULT_LIMIT);
    pre.textContent = head + '…';
    const more = document.createElement('button');
    more.className = 'more';
    more.type = 'button';
    let expanded = false;
    more.textContent = 'show more (' + full.length + ' chars)';
    more.addEventListener('click', () => {
      expanded = !expanded;
      pre.textContent = expanded ? full : head + '…';
      more.textContent = expanded ? 'show less' : 'show more (' + full.length + ' chars)';
      autoscroll();
    });
    t.el.appendChild(pre);
    t.el.appendChild(more);
  } else {
    pre.textContent = full;
    t.el.appendChild(pre);
  }
  autoscroll();
}

// --- EV dispatch ----------------------------------------------------------
function handleEv(e) {
  if (!e || typeof e !== 'object') return;
  switch (e.k) {
    case 'msg':     makeBubble(e.id, e.role, e.name); break;
    case 'text':    appendText(e.id, e.delta || ''); break;
    case 'think':   appendThink(e.id, e.delta || ''); break;
    case 'msgend':  break; // bubble already complete; nothing extra to render
    case 'tool':    makeTool(e.callId, e.name, e.input); break;
    case 'toolend': endTool(e.callId, e.result, !!e.ok); break;
    case 'status':  setStatus(e.text || ''); break;
    default:        break; // unknown k values MUST be ignored
  }
}

function setStatus(text) { statusEl.textContent = text; }

function setMeta(m) {
  if (typeof m.guests === 'number') {
    guestsEl.textContent = m.guests + (m.guests === 1 ? ' watching' : ' watching');
  }
  if (m.status) setConn(m.status);
}

function setConn(status) {
  // status: starting | live | ended | connecting
  dot.className = 'dot ' + status;
  const labels = { live: 'live', ended: 'ended', starting: 'starting…', connecting: 'connecting…' };
  connLabel.textContent = labels[status] || status;
}

// --- message frames -------------------------------------------------------
function handleFrame(data) {
  let m;
  try { m = JSON.parse(data); } catch (_) { return; }
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'meta': setMeta(m); break;
    case 'ev':   handleEv(m.e); break;
    case 'end':  onEnd(m.reason || ''); break;
    default:     break;
  }
}

function onEnd(reason) {
  ended = true;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  setConn('ended');
  banner.textContent = 'Session ended' + (reason ? ' — ' + reason : '') + '.';
  banner.hidden = false;
  if (ws) { try { ws.close(); } catch (_) {} }
  disableComposer();
}

// --- WebSocket lifecycle --------------------------------------------------
function wsURL() {
  const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
  return scheme + location.host + '/collab/guest/' + SESSIONID;
}

function connect() {
  if (ended) return;
  setConn('connecting');
  let sock;
  try { sock = new WebSocket(wsURL()); }
  catch (_) { scheduleReconnect(); return; }
  ws = sock;

  sock.addEventListener('open', () => {
    backoff = 1000;
    setConn('live');
  });
  sock.addEventListener('message', (ev) => { handleFrame(ev.data); });
  sock.addEventListener('close', () => {
    if (sock === ws) ws = null;
    if (ended) return;
    setConn('connecting');
    scheduleReconnect();
  });
  sock.addEventListener('error', () => { try { sock.close(); } catch (_) {} });
}

function scheduleReconnect() {
  if (ended || reconnectTimer) return;
  const delay = backoff + Math.floor(Math.random() * 400);
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect();
  }, delay);
  backoff = Math.min(backoff * 2, 15000);
}

function sendFrame(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    try { ws.send(JSON.stringify(obj)); return true; } catch (_) {}
  }
  return false;
}

// --- composer (only present when CanWrite) --------------------------------
const inputEl     = document.getElementById('input');
const sendBtn     = document.getElementById('send');
const interruptBtn = document.getElementById('interrupt');

function autosize() {
  if (!inputEl) return;
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 144) + 'px';
}

function submitPrompt() {
  if (!inputEl) return;
  const text = inputEl.value;
  if (!text.trim()) return;
  if (sendFrame({ t: 'prompt', text: text })) {
    inputEl.value = '';
    autosize();
  }
}

function disableComposer() {
  if (sendBtn) sendBtn.disabled = true;
  if (interruptBtn) interruptBtn.disabled = true;
  if (inputEl) inputEl.disabled = true;
}

if (CANWRITE && inputEl) {
  sendBtn.addEventListener('click', submitPrompt);
  interruptBtn.addEventListener('click', () => { sendFrame({ t: 'abort' }); });
  inputEl.addEventListener('input', autosize);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitPrompt();
    }
  });
}

connect();
</script>
</body>
</html>
